<html>
    <head>
        <title>mugon - dev server - {{.ProjectId}}</title>
        <style>
            .button {
                padding: 0.75rem 1.75rem;
                font-family: sans-serif;
                font-size: 1rem;
                font-weight: 600;
                color: white;
                background-color: #2E2E2E;
                border: 1px solid #3F3F3F;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.15s ease;
            }
            .button:hover {
                background-color: #3A3A3A;
            }
            .button:active {
                background-color: #232323;
            }
            .button:disabled {
                color: #777777;
                background-color: #262626;
                border-color: #333333;
                cursor: not-allowed;
            }
        </style>
    </head>
    <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #1F1F1F;">
        <script>window.__MUGON_WEBRTC_PORT__ = {{.WebrtcPort}};</script>
        <script src="./index.js" defer></script>
        <div style="position: absolute; top: 5vh; left: 50%; transform: translateX(-50%); color: white; font-family: sans-serif; font-size: 2rem;">Mugon CLI - Dev Server - {{.ProjectId}}</div>
        <iframe
            src="http://localhost:{{.GameFramePort}}"
            sandbox="allow-scripts"
            scrolling="no"
            style="width: 80vw; height: 80vh; border-color: white;"
        ></iframe>
        <div style="position: absolute; bottom: 5vh; width: 100vw; display: flex; justify-content: center; align-items: center; gap: 1rem;">
            <button id="start-server-button" class="button">Start as host</button>
            <button id="join-server-button" class="button">Start as client</button>
        </div>
    </body>
</html>
