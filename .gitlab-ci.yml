.mugon-cli-changes:
  rules:
    - changes:
        - libraries/mugon-cli/**/*
        - libraries/mugon-sdk-js/**/*
        - specs/api/**/*
        - package-lock.json

mugon-cli:codestyle:
  stage: codestyle
  image: golangci/golangci-lint:v2.8.0-alpine
  needs: []
  allow_failure: true
  rules: !reference [.mugon-cli-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-cli/go.sum
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  script:
    - cd libraries/mugon-cli
    - go mod download
    - golangci-lint run ./...

mugon-cli:generated-files:
  stage: codestyle
  # Pinned: the parentframe bundle is committed, so the toolchain that builds it must not drift.
  image: golang:1.24-alpine3.22
  needs: []
  rules: !reference [.mugon-cli-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-cli/go.sum
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  script:
    - apk add --no-cache nodejs npm git
    # npm ci fails on a stale lockfile instead of rewriting it.
    - npm ci -w @mugon/sdk
    - npm run build -w @mugon/sdk
    - cd libraries/mugon-cli
    - npm ci --prefix internal/templates/parentframe
    - go mod download
    - go generate
    # Everything go generate writes is committed (the public mirror cannot run it), so the tree must still be clean,
    # untracked files and the lockfiles go generate or npm may have touched included.
    - |
      if [ -n "$(git status --porcelain -- . ../../package-lock.json)" ]; then
        git status --short -- . ../../package-lock.json
        echo "Generated files are stale: run 'go generate' in libraries/mugon-cli and commit the result."
        exit 1
      fi

mugon-cli:build:
  stage: build
  image: golang:1.24-alpine
  rules: !reference [.mugon-cli-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-cli/go.sum
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  variables:
    CGO_ENABLED: "0"
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  script:
    - apk add --no-cache nodejs npm
    - npm ci -w @mugon/sdk
    - npm run build -w @mugon/sdk
    - cd libraries/mugon-cli
    - npm ci --prefix internal/templates/parentframe
    - go mod download
    - go generate
    - go build -o mugon ./cmd/mugon
  artifacts:
    paths:
      - libraries/mugon-cli/mugon

mugon-cli:release-dry-run:
  stage: build
  image:
    name: goreleaser/goreleaser:v2.17.0
    entrypoint: [""]
  variables:
    CGO_ENABLED: "0"
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GIT_DEPTH: 0
  rules: !reference [.mugon-cli-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-cli/go.sum
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  script:
    - apk add --no-cache nodejs npm
    - npm ci -w @mugon/sdk
    - npm run build -w @mugon/sdk
    - cd libraries/mugon-cli
    - npm ci --prefix internal/templates/parentframe
    - go generate
    - goreleaser release --snapshot
