name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  codestyle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

  build:
    runs-on: ubuntu-latest
    needs: [codestyle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go build -o mugon ./cmd/mugon
        env:
          CGO_ENABLED: "0"

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "version must look like v1.2.3" >&2
            exit 1
          fi
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Stable tags only: pre-releases never reach tools.mugon.net or the floating image tags.
      - name: Publish install scripts and index to tools.mugon.net
        id: stable
        run: |
          if echo "${{ github.event.inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            bash scripts/publish-tools.sh "${{ github.event.inputs.version }}"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "pre-release: skipping tools.mugon.net"
          fi
        env:
          TOOLS_STORAGE_ZONE: ${{ vars.TOOLS_STORAGE_ZONE }}
          TOOLS_STORAGE_KEY: ${{ secrets.TOOLS_STORAGE_KEY }}
      - name: Unpack the released binaries for the image
        run: |
          for arch in amd64 arm64; do
            mkdir -p "docker-bin/linux/${arch}"
            tar -xzf dist/mugon_*_linux_${arch}.tar.gz -C "docker-bin/linux/${arch}" mugon
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the images
        run: |
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          image="ghcr.io/${GITHUB_REPOSITORY}"
          floating=${{ steps.stable.outputs.stable }}
          tags() {
            variant="$1"
            echo "--tag ${image}:${version}-${variant}"
            if [ "$floating" = "true" ]; then echo "--tag ${image}:${variant}"; fi
          }
          docker buildx build --target cli --platform linux/amd64,linux/arm64 $(tags cli) --push .
          # slim and full need a published editor, which does not exist before the first editor release.
          if curl -fsS "https://tools.mugon.net/editor/index.json" > /dev/null; then
            docker buildx build --target slim --platform linux/amd64 $(tags slim) $( [ "$floating" = "true" ] && echo "--tag ${image}:latest" ) --push .
            docker buildx build --target full --platform linux/amd64 $(tags full) --push .
          else
            echo "no editor release yet: skipped the slim and full images"
          fi
