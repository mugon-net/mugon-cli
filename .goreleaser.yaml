version: 2

project_name: mugon

before:
  hooks:
    - go mod download

builds:
  - id: mugon
    main: ./cmd/mugon
    binary: mugon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mugon-net/cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
